name: Build Skiris APK

on:
  workflow_dispatch:  # Déclenchement manuel uniquement

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -PpreDexEnable=false --max-workers 2 --no-daemon

jobs:
  build:
    name: Build Skiris APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build Gplay Debug APK
        run: ./gradlew assembleFdroidDebug $CI_GRADLE_ARG_PROPERTIES

      - name: Upload Skiris APK
        uses: actions/upload-artifact@v4
        with:
          name: skiris-apk
          path: vector-app/build/outputs/apk/fdroid/debug/vector-fdroid-universal-debug.apk